<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Adventure Rapids Company</title>

    <meta name="description" content="Contact White Water Rafting Company for reservations, directions, questions, and customer support through our contact page.">
    <meta name="author" content="Babalola Akeem">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

<header>
    <img src="images/logo.jpg" alt="Adventure Rapids Company logo">

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>

    

    <section class="company-info">
        <h1>Adventure Rapids Company</h1>

        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 (999) 999-9999</p>
        <p>info@whitewater.com</p>
    </section>

    <section class="contact-container">

        <div class="map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6502565.951838052!2d-119.306607!3d37.26950555!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sCalifornia%2C%20USA!5e0!3m2!1sen!2sng!4v1785533097089!5m2!1sen!2sng"
                width="600"
                height="450"
                loading="lazy"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>

        <div class="contact-form">

            <form action="#" method="post">

                <h2>Send Us a Message</h2>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <p>Purpose of Message:</p>

                <div class="radio-group">
                    <input type="radio" id="general" name="purpose" value="general inquiry">
                    <label for="general">General Inquiry</label>
                </div>

                <div class="radio-group">
                    <input type="radio" id="reservation" name="purpose" value="reservation question">
                    <label for="reservation">Reservation Question</label>
                </div>

                <div class="radio-group">
                    <input type="radio" id="suggestion" name="purpose" value="website suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </div>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">

                    <label for="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get In Touch</button>

            </form>

        </div>

    </section>

    <section class="employees">

        <h2>We Are Here to Serve You</h2>

        <figure>
            <img src="images/employee1.jpg" alt=" James Berger, Manager">
            <figcaption>Berger James, Manager</figcaption>
        </figure>

        <figure>
            <img src="images/employee2.jpg" alt="Jude Emily, Guide">
            <figcaption>Jude Emily, Guide</figcaption>
        </figure>

        <figure>
            <img src="images/employee3.jpg" alt="Judith Rebecca, Customer Service Representative">
            <figcaption>Judith Rebecca, Customer Service Representative</figcaption>
        </figure>

    </section>

</main>

<footer>

    <p>© 2026 Adventure Rapids | Babalola Akeem</p>

    <nav class="socialmedia">

        <a href="https://facebook.com">
            <img src="images/facebook.svg" alt="Facebook">
        </a>

        <a href="https://linkedin.com">
            <img src="images/linkedin.svg" alt="LinkedIn">
        </a>

        <a href="https://instagram.com">
            <img src="images/instagram.svg" alt="Instagram">
        </a>

    </nav>

</footer>

</body>
</html>
