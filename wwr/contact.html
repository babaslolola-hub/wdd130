<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title> Contact Us |Adventure Rapids </title>
    <meta name="description" content="Contact Adventure Rapids for rafting information, reservations, questions, and customer support. Find our address, phone number, email, and send us a message through our contact form.">
    <meta name="author" content="Babalola Akeem">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Adventure Rapids logo">
        <nav>
           <ul>
               <li><a href="index.html">Home</a></li>
               <li><a href="about.html">About Us</a></li>
               <li><a href="trips.html">Trips</a></li>
               <li><a href="contact.html">Contact Us</a></li>
           </ul>
        </nav>
    </header>

    <main>
       <section class="company-info">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 (999) 999-9999</p>
            <p>info@whitewater.com</p>
       </section>
    <section class="contact-container">
        <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6502565.951838052!2d-119.306607!3d37.26950555!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sCalifornia%2C%20USA!5e0!3m2!1sen!2sng!4v1785533097089!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

        <div class="contact-form">
        <form>
           <h2>Contact Us</h2>
           <label for="name">Name:</label>
           <input type="text" id="name" name="name">
           <label for="email">Email:</label>
           <input type="email" id="email" name="email"> 
           <p>Purpose of Message:</p>

           <label>
           <input type="radio" name="purpose" value="general inquiry">
            General Inquiry
           </label>

           <label>
           <input type="radio" name="purpose" value="reservation question">
           Reservation Question
           </label>

           <label>
           <input type="radio" name="purpose" value="website suggestion">
            Website Suggestion
           </label>
           <label for="message">Message:</label>
           <textarea id="message" name="message"></textarea>
           <label>
          <input type="checkbox" name="newsletter" value="yes">
            Please Subscribe Me to the monthly newsletter
           </label>
           <button type="submit">Get In Touch</button>
        </form>
    </section>
    <section class="employees">
    <h2>We Are Here to Serve You</h2>

    <figure>
        <img src="images/employee1.jpg" alt="Employee name">
        <figcaption>Berger James - Manager</figcaption>
    </figure>

    <figure>
        <img src="images/employee2.jpg" alt="Employee name">
        <figcaption>Jude Emily- Guide</figcaption>
    </figure>

        <figure>
        <img src="images/employee3.jpg" alt="Employee name">
    <figcaption> Judith Rebbeca- Customer Service</figcaption>
       </figure>
   </section>
    
    </main>
    
<footer>
    <p>© 2026 Adventure Rapids | Babalola Akeem</p>
  <nav class="socialmedia">
    <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Facebook">
    </a>

    <a href="https://linkedin.com">
        <img src="images/linkedin.svg" alt="LinkedIn">
    </a>

    <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram">
    </a>
   </nav>
    </footer>
    
</body>
</html>
